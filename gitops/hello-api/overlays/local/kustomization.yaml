apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-api
resources:
  - ../../base
images:
  - name: hello-api
    newName: hello-api
    newTag: local
replicas:
  - name: hello-api
    count: 1
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
    target:
      kind: Deployment
      name: hello-api
