apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-api-dashboard
  labels:
    grafana_dashboard: "1"
data:
  hello-api.json: |
    {
      "title": "hello-api",
      "uid": "hello-api",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"hello-api\"}[2m]))",
              "legendFormat": "req/s"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Error rate (5xx)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"hello-api\", status=~\"5..\"}[2m])) / sum(rate(http_server_requests_seconds_count{namespace=\"hello-api\"}[2m]))",
              "legendFormat": "5xx ratio"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency p99 / p50",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"hello-api\"}[2m])))",
              "legendFormat": "p99"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"hello-api\"}[2m])))",
              "legendFormat": "p50"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Memory working set",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"hello-api\", container=\"hello-api\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
