apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hello-api
spec:
  groups:
    - name: hello-api
      rules:
        - alert: HelloApiHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="hello-api", status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="hello-api"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: hello-api is serving more than 5% errors
        - alert: HelloApiHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(http_server_requests_seconds_bucket{namespace="hello-api"}[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: hello-api p99 latency is above 1s
        - alert: HelloApiPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="hello-api"}[15m]) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: hello-api pods are restarting repeatedly
